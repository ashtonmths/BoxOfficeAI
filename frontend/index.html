<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoxOfficeAI Predictor</title>
  <style>
    :root {
      --bg-1: #0b1220;
      --bg-2: #132238;
      --card: rgba(255, 255, 255, 0.12);
      --line: rgba(255, 255, 255, 0.18);
      --text: #ecf3ff;
      --muted: #c9d8ef;
      --brand: #ffb347;
      --brand-2: #ffcc70;
      --danger: #ff6b6b;
      --ok: #4cd97b;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, #24426b 0%, transparent 35%),
        radial-gradient(circle at 85% 5%, #334f85 0%, transparent 32%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(980px, 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      padding: clamp(20px, 2.2vw, 30px);
      animation: pop-in 0.5s ease;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .api-row {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px;
      align-items: center;
    }

    form {
      margin-top: 24px;
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.86rem;
      margin-bottom: 8px;
      color: var(--muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    input, select, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
      padding: 12px 13px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--brand);
      background: rgba(255, 255, 255, 0.2);
    }

    button {
      border: none;
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      color: #1e1e1e;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.75;
      transform: none;
    }

    .result, .error, .meta {
      margin-top: 18px;
      border-radius: 12px;
      padding: 14px;
    }

    .result {
      border: 1px solid rgba(76, 217, 123, 0.6);
      background: rgba(76, 217, 123, 0.14);
      display: none;
    }

    .error {
      border: 1px solid rgba(255, 107, 107, 0.7);
      background: rgba(255, 107, 107, 0.14);
      color: #ffd6d6;
      display: none;
    }

    .meta {
      color: var(--muted);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      font-size: 0.9rem;
    }

    .pill {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--muted);
    }

    @media (max-width: 760px) {
      form {
        grid-template-columns: 1fr;
      }

      .api-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>BoxOfficeAI <span class="pill">Movie Predictor</span></h1>
    <p class="subtitle">
      Predict estimated revenue and hit probability from movie metadata.
      Actor and director inputs support dropdown suggestions and manual text.
    </p>

    <div class="api-row">
      <label for="apiBase">API Base URL</label>
      <input id="apiBase" type="text" value="http://127.0.0.1:8000" />
    </div>

    <form id="predictForm">
      <div>
        <label for="genre">Genre</label>
        <select id="genre" required></select>
      </div>

      <div>
        <label for="year">Release Year</label>
        <input id="year" type="number" min="1888" max="2100" value="2020" required />
      </div>

      <div>
        <label for="runtime">Runtime (minutes)</label>
        <input id="runtime" type="number" min="1" value="120" required />
      </div>

      <div>
        <label for="budget">Budget (USD)</label>
        <input id="budget" type="number" min="0" value="100000000" required />
      </div>

      <div>
        <label for="votes">Votes</label>
        <input id="votes" type="number" min="0" value="15000" required />
      </div>

      <div>
        <label for="actor">Actor (type or pick)</label>
        <input id="actor" list="actorList" placeholder="Leonardo DiCaprio" required />
        <datalist id="actorList"></datalist>
      </div>

      <div class="full">
        <label for="director">Director (type or pick)</label>
        <input id="director" list="directorList" placeholder="Christopher Nolan" required />
        <datalist id="directorList"></datalist>
      </div>

      <div class="full">
        <button id="submitBtn" type="submit">Predict Box Office</button>
      </div>
    </form>

    <section class="meta" id="metaBox">Loading options from backend...</section>
    <section class="error" id="errorBox"></section>
    <section class="result" id="resultBox"></section>
  </main>

  <script>
    const apiBaseInput = document.getElementById("apiBase");
    const form = document.getElementById("predictForm");
    const submitBtn = document.getElementById("submitBtn");
    const genreSelect = document.getElementById("genre");
    const actorList = document.getElementById("actorList");
    const directorList = document.getElementById("directorList");
    const resultBox = document.getElementById("resultBox");
    const errorBox = document.getElementById("errorBox");
    const metaBox = document.getElementById("metaBox");

    function api(path) {
      return `${apiBaseInput.value.replace(/\/$/, "")}${path}`;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
      resultBox.style.display = "none";
    }

    function showResult(data) {
      const revenue = Number(data.predicted_revenue || 0);
      const prob = Number(data.hit_probability || 0);
      const percent = (prob * 100).toFixed(2);
      resultBox.innerHTML = `
        <strong>Prediction: ${data.prediction}</strong><br>
        Predicted Revenue: ${revenue.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 })}<br>
        Hit Probability: ${percent}%
      `;
      resultBox.style.display = "block";
      errorBox.style.display = "none";
    }

    async function loadOptions() {
      metaBox.textContent = "Loading options from backend...";
      try {
        const response = await fetch(api("/options"));
        if (!response.ok) {
          throw new Error(`Failed to load options (${response.status})`);
        }

        const data = await response.json();
        genreSelect.innerHTML = "";
        actorList.innerHTML = "";
        directorList.innerHTML = "";

        (data.genres || []).forEach((genre, idx) => {
          const option = document.createElement("option");
          option.value = genre;
          option.textContent = genre;
          if (idx === 0) {
            option.selected = true;
          }
          genreSelect.appendChild(option);
        });

        (data.actors || []).forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          actorList.appendChild(option);
        });

        (data.directors || []).forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          directorList.appendChild(option);
        });

        metaBox.textContent = `Options loaded: ${data.genres?.length || 0} genres, ${data.actors?.length || 0} actors, ${data.directors?.length || 0} directors.`;
      } catch (error) {
        showError(error.message || "Unable to load options.");
        metaBox.textContent = "Could not load options. Check API URL and backend status.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Predicting...";

      const payload = {
        genre: genreSelect.value,
        year: Number(document.getElementById("year").value),
        runtime: Number(document.getElementById("runtime").value),
        budget: Number(document.getElementById("budget").value),
        director: document.getElementById("director").value.trim(),
        actor: document.getElementById("actor").value.trim(),
        votes: Number(document.getElementById("votes").value),
      };

      try {
        const response = await fetch(api("/predict"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `Prediction failed (${response.status})`);
        }

        showResult(data);
      } catch (error) {
        showError(error.message || "Prediction failed.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Predict Box Office";
      }
    });

    apiBaseInput.addEventListener("change", loadOptions);
    loadOptions();
  </script>
</body>
</html>
